spring.application.name=e-hospital-management
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/e_hospital?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
# Persistent databases migrate only after explicit operator opt-in.
spring.flyway.enabled=${HOSPITAL_MIGRATE:false}
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
hospital.bootstrap.username=${HOSPITAL_ADMIN_USERNAME:}
hospital.bootstrap.password=${HOSPITAL_ADMIN_PASSWORD:}
hospital.recovery.enabled=${HOSPITAL_RECOVERY_ENABLED:false}
hospital.recovery.base-url=${HOSPITAL_PUBLIC_URL:}
hospital.recovery.from=${HOSPITAL_MAIL_FROM:}
# Standard SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD environment variables configure SMTP.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.debug=false
