<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/public :: page('Password recovery', ~{::section})}"><body><section>
<p class="eyebrow">ACCOUNT RECOVERY</p><h2>Forgot your password?</h2><p class="text-secondary">Request a link to the recovery email registered by your administrator.</p>
<div class="alert alert-info" role="status" th:if="${sent}">If your account is eligible and recovery delivery is configured, you will receive a reset link. Otherwise, contact your administrator.</div>
<form method="post" th:action="@{/forgot-password}" th:object="${form}"><div th:replace="~{fragments/alerts :: formErrors}"></div><label class="form-label" for="username">Username *</label><input class="form-control" th:field="*{username}" autocomplete="username" maxlength="100" required><button class="btn btn-primary w-100 mt-4" type="submit">Request reset link</button></form><a class="back-link" th:href="@{/login}">← Back to sign in</a>
</section></body></html>
