<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Staff accounts', 'users', ~{::section})}"><body><section>
<div class="page-heading"><div><p class="eyebrow">ADMINISTRATION</p><h1>Staff accounts</h1><p class="text-secondary">Manage access to the hospital workspace.</p></div><a class="btn btn-primary" th:href="@{/admin/users/new}">+ Create staff account</a></div><div class="panel">
<form class="filter-form" method="get" th:action="@{/admin/users}"><div><label class="form-label" for="q">Find an account</label><input class="form-control" id="q" name="q" th:value="${q}" maxlength="100" placeholder="Search name or username"></div><button class="btn btn-primary" type="submit">Search</button><a class="btn btn-outline-secondary" th:href="@{/admin/users}">Reset</a></form>
<div class="table-responsive"><table class="table"><caption class="visually-hidden">Staff accounts</caption><thead><tr><th scope="col">Staff member</th><th scope="col">Username</th><th scope="col">Role</th><th scope="col">Status</th><th scope="col">Action</th></tr></thead><tbody><tr th:each="user : ${users.content}"><td th:text="${user.displayName}"></td><td th:text="${user.username}"></td><td th:text="${user.role}"></td><td><span class="status-badge" th:classappend="${user.active} ? 'green' : 'neutral'" th:text="${user.active} ? 'Active' : 'Inactive'"></span></td><td><a th:href="@{/admin/users/{id}(id=${user.id})}" th:attr="aria-label='Edit account for ' + ${user.username}">Edit account →</a></td></tr><tr th:if="${users.empty}"><td colspan="5" class="empty-state">No matching staff accounts. Try another name or reset your search.</td></tr></tbody></table></div>
<nav class="pagination-row" aria-label="Staff account pages"><span th:text="${users.totalElements} + ' accounts'"></span><a class="btn btn-outline-secondary" th:if="${users.hasPrevious()}" th:href="@{/admin/users(q=${q},page=${users.number - 1})}">Previous</a><span th:if="${users.totalPages > 0}" th:text="'Page ' + ${users.number + 1} + ' of ' + ${users.totalPages}"></span><a class="btn btn-outline-secondary" th:if="${users.hasNext()}" th:href="@{/admin/users(q=${q},page=${users.number + 1})}">Next</a></nav>
</div></section></body></html>
