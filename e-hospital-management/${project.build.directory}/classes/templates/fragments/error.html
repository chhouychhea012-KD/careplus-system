<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(code, title, message)"><head th:replace="~{fragments/head :: head(${title})}"></head><body class="message-page"><main class="panel message-panel"><img th:src="@{/css/logo.svg}" width="48" height="48" alt="CareBridge Hospital"><p class="eyebrow mt-4" th:text="${code} + ' · CAREBRIDGE WORKSPACE'"></p><h1 th:text="${title}"></h1><p class="text-secondary" th:text="${message}"></p><p class="form-hint" th:if="${errorReference}">Reference: <span th:text="${errorReference}"></span></p><a class="btn btn-primary" th:if="${signedIn}" th:href="@{/}">Return to workspace</a><a class="btn btn-primary" th:unless="${signedIn}" th:href="@{/login}">Back to sign in</a></main></body></html>
