<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('My profile', 'profile', ~{::section})}"><body><section>
<div class="page-heading"><div><p class="eyebrow">ACCOUNT &amp; SECURITY</p><h1>My profile</h1><p class="text-secondary">Keep your contact details current.</p></div><a class="btn btn-outline-secondary" th:href="@{/profile/password}">Change password</a></div>
<div class="profile-grid"><div class="panel"><h2>Personal information</h2><p class="form-hint">Fields marked * are required.</p><form method="post" th:action="@{/profile}" th:object="${form}" data-unsaved-warning>
<div th:replace="~{fragments/alerts :: formErrors}"></div><label class="form-label" for="displayName">Display name *</label><input class="form-control" th:field="*{displayName}" maxlength="100" required autocomplete="name" th:attr="aria-invalid=${#fields.hasErrors('displayName')}">
<label class="form-label" for="phone">Contact phone</label><input class="form-control" th:field="*{phone}" maxlength="30" autocomplete="tel" inputmode="tel"><div class="form-actions"><button class="btn btn-primary" type="submit">Save profile</button><a class="btn btn-outline-secondary" th:href="@{/}">Cancel</a></div></form></div>
<aside class="panel account-details"><span class="avatar large" aria-hidden="true">+</span><h2 th:text="${profile.username}"></h2><span class="status-badge" th:text="${profile.role}"></span><hr><p class="detail-label">Recovery email</p><p th:text="${profile.email != null ? profile.email : 'Not configured'}"></p><p class="form-hint">Your administrator manages your username, verified recovery email and assigned role. These cannot be changed from your profile.</p></aside></div>
</section></body></html>
