spring.application.name=e-hospital-management
server.address=127.0.0.1
server.port=8090
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
server.error.include-message=never
server.error.include-stacktrace=never
# Browsers revalidate CSS/JS on every load (cheap 304s), so a rebuilt UI is never hidden behind a stale cache.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.use-last-modified=true
# Telegram Mini App: leave empty (default) to keep live Telegram access disabled. Supply via the CAREPLUS_TELEGRAM_BOT_TOKEN environment variable; never commit a token.
careplus.telegram.bot-token=${CAREPLUS_TELEGRAM_BOT_TOKEN:}
careplus.mode=${CAREPLUS_MODE:demo}
careplus.telegram.webhook-secret=${CAREPLUS_TELEGRAM_WEBHOOK_SECRET:}
careplus.telegram.webhook-enabled=${CAREPLUS_TELEGRAM_WEBHOOK_ENABLED:false}
careplus.telegram.send-enabled=${CAREPLUS_TELEGRAM_SEND_ENABLED:false}
