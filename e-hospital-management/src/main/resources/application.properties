spring.application.name=e-hospital-management
server.address=127.0.0.1
server.port=8090
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
server.error.include-message=never
server.error.include-stacktrace=never
spring.web.resources.cache.period=1h
# Telegram Mini App: leave empty (default) to keep live Telegram access disabled. Supply via the CAREPLUS_TELEGRAM_BOT_TOKEN environment variable; never commit a token.
careplus.telegram.bot-token=${CAREPLUS_TELEGRAM_BOT_TOKEN:}
