<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/public :: page('Reset password', ~{::section})}"><body><section>
<p class="eyebrow">ACCOUNT RECOVERY</p><h2>Choose a new password</h2><p class="text-secondary">Reset links expire after 30 minutes and can be used once.</p><form method="post" th:action="@{/reset-password}" th:object="${form}">
<div th:replace="~{fragments/alerts :: formErrors}"></div><input type="hidden" name="token" id="resetToken" th:value="*{token}"><p class="form-hint" id="resetLinkHint" role="status">Open this page from your recovery email. JavaScript is required to read the secure link.</p>
<label class="form-label" for="newPassword">New password *</label><input class="form-control" id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" aria-describedby="password-hint" required><p class="form-hint" id="password-hint">At least 12 characters; at most 72 UTF-8 bytes.</p><label class="form-label" for="confirmPassword">Confirm new password *</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required><button class="btn btn-primary w-100 mt-4" type="submit">Reset password</button></form><a class="back-link" th:href="@{/forgot-password}">Request a new link</a>
</section></body></html>
