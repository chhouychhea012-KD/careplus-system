<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Change password', 'profile', ~{::section})}"><body><section>
<div class="page-heading"><div><p class="eyebrow">ACCOUNT &amp; SECURITY</p><h1>Change password</h1><p class="text-secondary">Changing your password ends your active sessions.</p></div></div><div class="panel narrow"><form method="post" th:action="@{/profile/password}" th:object="${form}" data-unsaved-warning>
<div th:replace="~{fragments/alerts :: formErrors}"></div><label class="form-label" for="currentPassword">Current password *</label><input class="form-control" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" maxlength="72" required>
<label class="form-label" for="newPassword">New password *</label><input class="form-control" id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" aria-describedby="password-hint" required><p class="form-hint" id="password-hint">Use at least 12 characters and no more than 72 UTF-8 bytes. Some characters use multiple bytes.</p>
<label class="form-label" for="confirmPassword">Confirm new password *</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="72" required><div class="form-actions"><button class="btn btn-primary" type="submit">Save new password</button><a class="btn btn-outline-secondary" th:href="@{/profile}">Cancel</a></div></form></div>
</section></body></html>
