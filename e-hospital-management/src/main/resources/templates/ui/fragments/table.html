<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="table" class="card records-card">
  <div class="table-toolbar"><div class="search-input"><i data-lucide="search"></i><input aria-label="Search records" :placeholder="'Search '+(meta?.title || 'records').toLowerCase()+'...'" x-model="search" @input.debounce.300ms="page=1;loadRecords()"/></div>
    <div class="toolbar-controls"><select aria-label="Filter by status" x-model="status" @change="page=1;loadRecords()"><option value="">All statuses</option><template x-for="s in meta?.statuses || []"><option :value="s" x-text="s"></option></template></select><button class="btn btn-white" @click="filtersOpen=!filtersOpen" :class="{'selected':filtersOpen}"><i data-lucide="sliders-horizontal"></i>Filters<span class="filter-dot" x-show="combinedFilter || from || to"></span></button><a class="icon-button" :href="exportUrl" aria-label="Export filtered CSV" title="Export CSV"><i data-lucide="download"></i></a></div>
  </div>
  <div class="filter-panel" x-show="filtersOpen" x-cloak><label>From date<input type="date" x-model="from"/></label><label>To date<input type="date" x-model="to" :min="from"/></label><label x-show="filterField"><span x-text="filterField?.label"></span><select aria-label="Additional filter" x-model="filter"><option value="">All</option><template x-for="o in options(filterField)"><option :value="o.id" x-text="o.name"></option></template></select></label><label x-show="['appointments','opd','visits'].includes(module)">Doctor<select aria-label="Doctor filter" x-model="doctorFilter"><option value="">All doctors</option><template x-for="o in refs.doctors || []"><option :value="o.id" x-text="o.name"></option></template></select></label><label x-show="module==='patients'">Minimum age<input type="number" min="0" max="130" x-model="ageMin"/></label><label x-show="module==='patients'">Maximum age<input type="number" min="0" max="130" x-model="ageMax"/></label><button class="btn btn-primary" @click="page=1;loadRecords()">Apply filters</button><button class="btn btn-white" @click="resetFilters()">Reset</button></div>
  <div class="table-scroll" :aria-busy="loading"><table class="data-table"><thead><tr><th><span x-text="meta?.singular || 'Record'" class="capitalize"></span></th><template x-for="f in columns" :key="f.key"><th x-text="f.label"></th></template><th>Status</th><th class="action-column">Actions</th></tr></thead><tbody>
    <template x-for="(row,index) in records" :key="row.id"><tr><td><button class="record-link" @click="module==='appointments'?location.href='/care/appointments/'+row.id:view(row)"><span class="avatar" :class="avatarColor(index)" x-text="initials(row.name)" x-show="['patients','doctors','staff','access'].includes(module)"></span><span><strong x-text="row.name"></strong><small x-text="row.id"></small></span></button></td><template x-for="f in columns" :key="f.key"><td><span :class="{'muted':f.type==='date'}" :data-ui-text="f.type==='select'?'':null" x-text="fieldValue(row,f)"></span><small class="cell-subtext" x-show="f.key==='date' && row.time" x-text="formatTime(row.time)"></small></td></template><td><span class="badge" :class="badge(row.status)"><span></span><span x-text="row.status"></span></span><div x-show="module==='appointments'"><small class="cell-subtext" data-ui-text x-text="row.arrivalStatus"></small><small class="cell-subtext" data-ui-text x-text="row.consultationStatus"></small><small class="cell-subtext"><span data-no-translate x-text="row.queueNumber"></span> · <span data-ui-text x-text="row.queueStatus"></span></small></div></td><td><div class="row-actions" x-data="{open:false}" @click.outside="open=false"><button class="icon-button" @click="open=!open" :aria-label="'Actions for '+row.name" :aria-expanded="open"><i data-lucide="ellipsis"></i></button><div class="dropdown-menu row-menu" x-cloak x-show="open"><button @click="view(row);open=false">View detail</button><button x-show="canEdit" @click="edit(row);open=false">Edit record</button><template x-for="action in actions(row)"><button @click="runAction(row,action);open=false" x-text="action"></button></template><button class="danger-text" x-show="canDelete" @click="askDelete(row);open=false">Delete record</button></div></div></td></tr></template>
  </tbody></table></div>
  <div class="loading-state" x-show="loading"><span class="spinner"></span>Loading records…</div><div class="empty-state" x-show="!loading && records.length===0"><span class="empty-icon"><i data-lucide="inbox"></i></span><h3>No records found</h3><p>Try adjusting your search or filters, or create the first record.</p><button class="btn btn-white" @click="resetFilters()">Clear filters</button></div>
  <div class="pagination"><p>Showing <strong x-text="total?((page-1)*size+1):0"></strong>–<strong x-text="Math.min(page*size,total)"></strong> of <strong x-text="total"></strong> records</p><div><select aria-label="Rows per page" x-model.number="size" @change="page=1;loadRecords()"><option :value="8">8 / page</option><option :value="16">16 / page</option><option :value="32">32 / page</option></select><button class="pagination-button" @click="page--;loadRecords()" :disabled="page<=1" aria-label="Previous page">‹</button><template x-for="p in pages"><button class="pagination-button" :class="{'current':page===p}" @click="page=p;loadRecords()" x-text="p" :aria-label="'Page '+p"></button></template><button class="pagination-button" @click="page++;loadRecords()" :disabled="page>=pages" aria-label="Next page">›</button></div></div>
</section>
</body></html>
