<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- One sidebar for every staff page. Links come from NavigationAdvice (role-based); the server still checks every permission.
     Expects `mobileNav` and `compact` in the nearest Alpine scope (hospital() on module pages, shellState() on clinical pages). -->
<aside th:fragment="sidebar" class="sidebar nav2" :class="{'is-open':mobileNav,'is-compact':compact}" aria-label="Main navigation">
  <a href="/" class="brand"><span class="brand-mark"><i data-lucide="plus"></i></span><span class="brand-text">care<span>plus</span><small>HOSPITAL MANAGEMENT</small></span></a>
  <div class="nav2-role"><span class="nav2-role-dot"></span><span><small>Signed in as</small><strong th:text="${navRole}" data-ui-text>Role</strong></span></div>
  <nav>
    <th:block th:each="g,gi : ${navGroups}">
      <div class="nav2-group" th:if="${!g.collapsible()}">
        <div class="nav2-label" th:text="${g.label()}">Group</div>
        <a th:each="n : ${g.items()}" th:href="${n.href()}" class="nav-link" th:classappend="${n.active()}?'active'" th:attr="aria-current=${n.active()?'page':null},title=${n.label()}"><i th:attr="data-lucide=${n.icon()}"></i><span th:text="${n.label()}">Item</span></a>
      </div>
      <div class="nav2-group" th:if="${g.collapsible()}" x-data="{open:false}" x-init="open=localStorage.getItem('careplus-nav-more')==='open'||!!$el.querySelector('.nav-link.active')">
        <button type="button" class="nav2-label nav2-toggle" @click="open=!open;localStorage.setItem('careplus-nav-more',open?'open':'closed')" :aria-expanded="open"><span th:text="${g.label()}">More</span><i data-lucide="chevron-down" :class="{'rot':open}"></i></button>
        <div x-show="open" x-cloak>
          <a th:each="n : ${g.items()}" th:href="${n.href()}" class="nav-link nav-link-sm" th:classappend="${n.active()}?'active'" th:attr="aria-current=${n.active()?'page':null},title=${n.label()}"><i th:attr="data-lucide=${n.icon()}"></i><span th:text="${n.label()}">Item</span></a>
        </div>
      </div>
    </th:block>
  </nav>
  <div class="sidebar-bottom"><div class="demo-card"><i data-lucide="shield-check"></i><div>Demo workspace<small>Synthetic data only</small></div></div><button type="button" class="nav-link compact-toggle" @click="compact=!compact;localStorage.setItem('careplus-compact',compact)" aria-label="Toggle sidebar width"><i data-lucide="panel-left-close"></i><span>Collapse sidebar</span></button></div>
</aside>

<!-- Top bar for clinical pages: page title + breadcrumb, language/theme, user menu. -->
<header th:fragment="topbar(crumb,title)" class="topbar">
  <div class="topbar-left"><button type="button" class="icon-button mobile-menu" @click="mobileNav=!mobileNav" aria-label="Open navigation"><i data-lucide="menu"></i></button>
    <div class="breadcrumb"><a href="/">Workspace</a><i data-lucide="chevron-right"></i><th:block th:if="${crumb!=null and crumb!=''}"><span th:text="${crumb}">Section</span><i data-lucide="chevron-right"></i></th:block><span class="crumb-current" th:text="${title}">Page</span></div></div>
  <div class="topbar-right"><div class="pref-desktop" data-preference-controls></div>
    <a class="icon-button notification-bell" href="/notifications" aria-label="Open notifications"><i data-lucide="bell"></i></a><div class="topbar-divider"></div>
    <div class="user-dropdown" x-data="{open:false}" @click.outside="open=false"><button type="button" class="user-button" @click="open=!open" :aria-expanded="open"><span class="avatar avatar-teal" th:text="${#strings.toUpperCase(#strings.substring(navUser==null or navUser=='' ? 'U' : navUser,0,1))}">U</span><span class="user-name"><strong th:text="${navUser}" data-no-translate>user</strong><small th:text="${navRole}" data-ui-text>Role</small></span><i data-lucide="chevron-down"></i></button>
      <div class="dropdown-menu" x-cloak x-show="open"><div class="pref-mobile" data-preference-controls></div><a href="/profile">My profile</a><a href="/appearance">Appearance settings</a><form method="post" action="/logout"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit" class="danger-text">Sign out of demo</button></form></div></div>
  </div>
</header>
</body>
</html>
