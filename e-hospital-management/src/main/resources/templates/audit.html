<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page('Audit history', 'audit', ~{::section})}"><body><section>
<div class="page-heading"><div><p class="eyebrow">ADMINISTRATION</p><h1>Audit history</h1><p class="text-secondary">Trace security and account actions. All times are in UTC.</p></div></div><div class="panel"><form class="filter-form" method="get" th:action="@{/admin/audit}"><div><label class="form-label" for="actor">Search by actor</label><input class="form-control" id="actor" name="actor" th:value="${actor}" maxlength="100" placeholder="Username, SYSTEM or ANONYMOUS"></div><button class="btn btn-primary" type="submit">Search</button><a class="btn btn-outline-secondary" th:href="@{/admin/audit}">Reset</a></form>
<div class="table-responsive"><table class="table"><caption class="visually-hidden">Audit events, newest first</caption><thead><tr><th scope="col">Time (UTC)</th><th scope="col">Actor</th><th scope="col">Action</th><th scope="col">Target</th></tr></thead><tbody><tr th:each="event : ${events.content}"><td th:text="${event.occurredAt}"></td><td th:text="${event.actor}"></td><td><span class="status-badge neutral" th:text="${event.action}"></span></td><td th:text="${event.target}"></td></tr><tr th:if="${events.empty}"><td colspan="4" class="empty-state">No matching audit events. Try another actor or reset your search.</td></tr></tbody></table></div>
<nav class="pagination-row" aria-label="Audit history pages"><span th:text="${events.totalElements} + ' events'"></span><a class="btn btn-outline-secondary" th:if="${events.hasPrevious()}" th:href="@{/admin/audit(actor=${actor},page=${events.number - 1})}">Previous</a><span th:if="${events.totalPages > 0}" th:text="'Page ' + ${events.number + 1} + ' of ' + ${events.totalPages}"></span><a class="btn btn-outline-secondary" th:if="${events.hasNext()}" th:href="@{/admin/audit(actor=${actor},page=${events.number + 1})}">Next</a></nav>
</div></section></body></html>
